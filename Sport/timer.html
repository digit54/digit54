<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer Fitness</title>
<style>
  :root {
    --bg: #10141c;
    --card: #1a2030;
    --accent: #4fd1c5;
    --accent2: #f6ad55;
    --text: #f5f7fa;
    --muted: #8b95a7;
    --danger: #fc8181;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #10141c, #1b2333);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--text);
    padding: 10px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px 20px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  h1 {
    text-align: center;
    font-size: 1.15rem;
    margin: 0 0 10px;
    letter-spacing: 1px;
  }
  .settings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-bottom: 12px;
  }
  .setting-group {
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    padding: 6px 9px;
  }
  .setting-group.full { grid-column: 1 / -1; }
  label {
    display: block;
    font-size: 0.62rem;
    color: var(--muted);
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .time-inputs {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  input[type="number"] {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 7px;
    color: var(--text);
    font-size: 0.95rem;
    padding: 5px 5px;
    text-align: center;
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  select {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 7px;
    color: var(--text);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 6px 6px;
  }
  select option {
    color: #10141c;
    background: #fff;
    font-weight: 600;
    font-size: 0.85rem;
  }
  select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .sep { color: var(--muted); font-weight: bold; }
  .display {
    text-align: center;
    margin: 4px 0 10px;
  }
  .phase {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 2px;
    color: var(--accent);
    transition: color 0.3s;
  }
  .phase.rest { color: var(--accent2); }
  .time {
    font-size: 2.8rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .cycle-info {
    margin-top: 4px;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .progress-ring {
    display: flex;
    justify-content: center;
    margin-bottom: 6px;
  }
  .buttons {
    display: flex;
    gap: 8px;
  }
  button {
    flex: 1;
    padding: 9px;
    border: none;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:active { transform: scale(0.96); }
  #startBtn { background: var(--accent); color: #0a1a18; }
  #pauseBtn { background: var(--accent2); color: #2a1a05; }
  #resetBtn { background: rgba(255,255,255,0.1); color: var(--text); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .finished {
    text-align: center;
    color: var(--accent);
    font-weight: 600;
    margin-top: 6px;
    min-height: 1.1em;
    font-size: 0.9rem;
  }
  .credit {
    text-align: center;
    color: var(--muted);
    font-size: 0.65rem;
    opacity: 0.5;
    margin-top: 8px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>⏱ Timer Allenamento</h1>

  <div class="settings">
    <div class="setting-group">
      <label>Durata lavoro</label>
      <div class="time-inputs">
        <input type="number" id="workMin" min="0" max="99" value="0">
        <span class="sep">:</span>
        <input type="number" id="workSec" min="0" max="58" step="2" value="30">
      </div>
    </div>
    <div class="setting-group">
      <label>Durata pausa</label>
      <div class="time-inputs">
        <input type="number" id="restMin" min="0" max="99" value="0">
        <span class="sep">:</span>
        <input type="number" id="restSec" min="0" max="58" step="2" value="14">
      </div>
    </div>
    <div class="setting-group full">
      <label>Numero ripetizioni (cicli)</label>
      <input type="number" id="repeats" min="1" max="99" value="5">
    </div>
    <div class="setting-group">
      <label>Bip ogni (sec) - Lavoro</label>
      <input type="number" id="workBeepInterval" min="2" max="60" step="2" value="2">
    </div>
    <div class="setting-group">
      <label>Bip ogni (sec) - Pausa</label>
      <input type="number" id="restBeepInterval" min="2" max="60" step="2" value="2">
    </div>
    <div class="setting-group full voice-toggle">
      <label style="margin-bottom:0; display:flex; align-items:center; gap:8px; cursor:pointer;">
        <input type="checkbox" id="voiceEnabled" checked style="width:auto;">
        Voce sintetica (annuncia fasi e conto alla rovescia)
      </label>
    </div>
    <div class="setting-group full">
      <label>Voce</label>
      <select id="voiceSelect">
        <option value="">Predefinita</option>
      </select>
    </div>
  </div>

  <div class="display">
    <div class="phase" id="phaseLabel">Pronto</div>
    <div class="time" id="timeDisplay">00:30</div>
    <div class="cycle-info" id="cycleInfo">Ciclo 0 / 0</div>
  </div>

  <div class="buttons">
    <button id="startBtn">Avvia</button>
    <button id="pauseBtn" disabled>Pausa</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="finished" id="finishedMsg"></div>

  <div class="credit">Digit54 v. 1.0</div>
</div>

<script>
  const workMinInput = document.getElementById('workMin');
  const workSecInput = document.getElementById('workSec');
  const restMinInput = document.getElementById('restMin');
  const restSecInput = document.getElementById('restSec');
  const repeatsInput = document.getElementById('repeats');
  const workBeepIntervalInput = document.getElementById('workBeepInterval');
  const restBeepIntervalInput = document.getElementById('restBeepInterval');
  const voiceEnabledInput = document.getElementById('voiceEnabled');
  const voiceSelectInput = document.getElementById('voiceSelect');

  const phaseLabel = document.getElementById('phaseLabel');
  const timeDisplay = document.getElementById('timeDisplay');
  const cycleInfo = document.getElementById('cycleInfo');
  const finishedMsg = document.getElementById('finishedMsg');

  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');

  const allInputs = [workMinInput, workSecInput, restMinInput, restSecInput, repeatsInput, workBeepIntervalInput, restBeepIntervalInput];

  let intervalId = null;
  let remaining = 0;
  let currentPhase = 'work'; // 'work' | 'toRest' | 'rest' | 'toWork'
  let currentCycle = 1;
  let totalCycles = 5;
  let running = false;
  let hasStarted = false;

  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { /* wake lock non disponibile o negato */ }
  }
  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) {
      requestWakeLock();
    }
  });

  let audioCtx = null;
  function beep(freq = 880, duration = 150) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration / 1000);
      osc.stop(audioCtx.currentTime + duration / 1000);
    } catch (e) { /* audio non disponibile */ }
  }

  const FEMALE_NAME_HINTS = ['elsa', 'alice', 'federica', 'paola', 'luciana', 'monica', 'sara', 'giulia', 'chiara', 'isabella', 'female', 'donna', 'woman'];
  const MALE_NAME_HINTS = ['cosimo', 'luca', 'diego', 'marco', 'male', 'uomo', 'man'];

  function guessGender(voice) {
    const n = voice.name.toLowerCase();
    if (FEMALE_NAME_HINTS.some(h => n.includes(h))) return 'femminile';
    if (MALE_NAME_HINTS.some(h => n.includes(h))) return 'maschile';
    return null;
  }

  let userVoiceChoiceMade = false;

  function populateVoiceList() {
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    const itVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('it'));
    const list = itVoices.length ? itVoices : voices;
    const previousValue = voiceSelectInput.value;
    voiceSelectInput.innerHTML = '<option value="">Predefinita</option>';
    list.forEach(v => {
      const gender = guessGender(v);
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = v.name + (gender ? ` (${gender})` : '') + (v.lang ? ` — ${v.lang}` : '');
      voiceSelectInput.appendChild(opt);
    });
    if (list.some(v => v.name === previousValue)) {
      voiceSelectInput.value = previousValue;
    } else if (!userVoiceChoiceMade) {
      const female = list.find(v => guessGender(v) === 'femminile');
      if (female) voiceSelectInput.value = female.name;
    }
  }

  voiceSelectInput.addEventListener('change', () => {
    userVoiceChoiceMade = true;
  });

  if ('speechSynthesis' in window) {
    populateVoiceList();
    window.speechSynthesis.onvoiceschanged = populateVoiceList;
  }

  function speak(text) {
    if (!voiceEnabledInput.checked) return;
    try {
      if (!('speechSynthesis' in window)) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'it-IT';
      utter.rate = 1;
      utter.volume = 1;
      const selectedName = voiceSelectInput.value;
      if (selectedName) {
        const voice = window.speechSynthesis.getVoices().find(v => v.name === selectedName);
        if (voice) utter.voice = voice;
      }
      window.speechSynthesis.speak(utter);
    } catch (e) { /* sintesi vocale non disponibile */ }
  }

  function getWorkSeconds() {
    return (parseInt(workMinInput.value) || 0) * 60 + (parseInt(workSecInput.value) || 0);
  }
  function getRestSeconds() {
    return (parseInt(restMinInput.value) || 0) * 60 + (parseInt(restSecInput.value) || 0);
  }
  function getRepeats() {
    return Math.max(1, parseInt(repeatsInput.value) || 1);
  }
  function toEvenStep(value) {
    const n = Math.max(2, parseInt(value) || 2);
    return n % 2 === 0 ? n : n + 1;
  }
  function toEvenSeconds(value) {
    let n = parseInt(value);
    if (isNaN(n)) n = 0;
    n = Math.max(0, Math.min(58, n));
    return n % 2 === 0 ? n : n + 1;
  }
  function getWorkBeepInterval() {
    return toEvenStep(workBeepIntervalInput.value);
  }
  function getRestBeepInterval() {
    return toEvenStep(restBeepIntervalInput.value);
  }

  const TRANSITION_BUFFER_SECONDS = 1;

  const PHASE_LABELS = {
    work: 'Lavoro',
    toRest: 'Pausa',
    rest: 'Pausa',
    toWork: 'Via'
  };

  function updateDisplay() {
    let displayValue;
    if (currentPhase === 'work') {
      displayValue = Math.ceil(remaining / getWorkBeepInterval());
    } else if (currentPhase === 'rest') {
      displayValue = Math.ceil(remaining / getRestBeepInterval());
    }
    timeDisplay.textContent = (currentPhase === 'toRest' || currentPhase === 'toWork')
      ? '–'
      : String(Math.max(0, displayValue));
    phaseLabel.textContent = PHASE_LABELS[currentPhase] || currentPhase;
    phaseLabel.classList.toggle('rest', currentPhase === 'toRest' || currentPhase === 'rest');
    cycleInfo.textContent = `Ciclo ${currentCycle} / ${totalCycles}`;
  }

  function setInputsDisabled(disabled) {
    allInputs.forEach(inp => inp.disabled = disabled);
  }

  // Numero di "reps" mostrato/pronunciato: stesso calcolo usato dal display (Math.ceil)
  let lastSpokenReps = null;

  function repsFor(interval) {
    return Math.ceil(remaining / interval);
  }

  // Annuncia il numero di "reps" all'inizio di una fase work/rest
  function announceFirstRep(phase) {
    const interval = phase === 'work' ? getWorkBeepInterval() : getRestBeepInterval();
    lastSpokenReps = null;
    const reps = repsFor(interval);
    if (reps > 0) {
      speak(String(reps));
      lastSpokenReps = reps;
    }
  }

  function startWorkPhase() {
    currentPhase = 'work';
    remaining = getWorkSeconds();
    announceFirstRep('work');
  }

  function startRestPhase() {
    currentPhase = 'rest';
    remaining = getRestSeconds();
    announceFirstRep('rest');
  }

  function resetState() {
    clearInterval(intervalId);
    intervalId = null;
    running = false;
    releaseWakeLock();
    hasStarted = false;
    currentPhase = 'work';
    currentCycle = 1;
    totalCycles = getRepeats();
    remaining = getWorkSeconds();
    finishedMsg.textContent = '';
    setInputsDisabled(false);
    startBtn.disabled = false;
    startBtn.textContent = 'Avvia';
    pauseBtn.disabled = true;
    pauseBtn.textContent = 'Pausa';
    updateDisplay();
  }

  function tick() {
    remaining--;
    if (remaining <= 0) {
      handlePhaseEnd();
      return;
    }
    if (currentPhase === 'work') {
      const reps = repsFor(getWorkBeepInterval());
      if (reps !== lastSpokenReps) {
        beep(440, 80);
        speak(String(reps));
        lastSpokenReps = reps;
      }
    } else if (currentPhase === 'rest') {
      const reps = repsFor(getRestBeepInterval());
      if (reps !== lastSpokenReps) {
        beep(220, 80);
        speak(String(reps));
        lastSpokenReps = reps;
      }
    }
    // 'toRest' e 'toWork' sono buffer di transizione: secondi non conteggiati, nessun annuncio numerico
    updateDisplay();
  }

  function handlePhaseEnd() {
    if (currentPhase === 'work') {
      const restSecs = getRestSeconds();
      if (restSecs > 0) {
        currentPhase = 'toRest';
        remaining = TRANSITION_BUFFER_SECONDS;
        beep(660, 200);
        speak('Pausa');
      } else if (currentCycle >= totalCycles) {
        finishWorkout();
        return;
      } else {
        currentCycle++;
        beep(990, 250);
        speak('Via');
        startWorkPhase();
      }
    } else if (currentPhase === 'toRest') {
      startRestPhase();
    } else if (currentPhase === 'rest') {
      if (currentCycle >= totalCycles) {
        finishWorkout();
        return;
      }
      currentCycle++;
      currentPhase = 'toWork';
      remaining = TRANSITION_BUFFER_SECONDS;
      beep(990, 250);
      speak('Via');
    } else if (currentPhase === 'toWork') {
      startWorkPhase();
    }
    updateDisplay();
  }

  function finishWorkout() {
    clearInterval(intervalId);
    intervalId = null;
    running = false;
    releaseWakeLock();
    beep(1200, 400);
    setTimeout(() => beep(1200, 400), 450);
    speak('Allenamento completato');
    phaseLabel.textContent = 'Completato';
    phaseLabel.classList.remove('rest');
    timeDisplay.textContent = '0';
    finishedMsg.textContent = '🎉 Allenamento completato!';
    startBtn.disabled = false;
    startBtn.textContent = 'Riavvia';
    pauseBtn.disabled = true;
    setInputsDisabled(false);
  }

  function startTimer() {
    if (running) return;
    if (!intervalId && remaining <= 0) {
      // fresh start after finish
      currentCycle = 1;
      totalCycles = getRepeats();
      startWorkPhase();
      finishedMsg.textContent = '';
    }
    if (!hasStarted) {
      hasStarted = true;
      speak('Via');
      announceFirstRep('work');
    }
    running = true;
    setInputsDisabled(true);
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    pauseBtn.textContent = 'Pausa';
    updateDisplay();
    intervalId = setInterval(tick, 1000);
    requestWakeLock();
  }

  function pauseTimer() {
    if (!running) return;
    running = false;
    releaseWakeLock();
    clearInterval(intervalId);
    intervalId = null;
    startBtn.disabled = false;
    startBtn.textContent = 'Riprendi';
    pauseBtn.disabled = true;
  }

  startBtn.addEventListener('click', startTimer);
  pauseBtn.addEventListener('click', pauseTimer);
  resetBtn.addEventListener('click', resetState);

  [workMinInput, restMinInput, repeatsInput].forEach(inp => {
    inp.addEventListener('change', () => {
      if (!running && !intervalId) resetState();
    });
  });

  [workSecInput, restSecInput].forEach(inp => {
    inp.addEventListener('change', () => {
      inp.value = toEvenSeconds(inp.value);
      if (!running && !intervalId) resetState();
    });
  });

  [workBeepIntervalInput, restBeepIntervalInput].forEach(inp => {
    inp.addEventListener('change', () => {
      inp.value = toEvenStep(inp.value);
      if (!running && !intervalId) resetState();
    });
  });

  resetState();
</script>

</body>
</html>
