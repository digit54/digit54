      String(r.quant ?? '').toLowerCase().includes(q) ||
      String(r.forn ?? '').toLowerCase().includes(q) ||
      String(r.desc ?? '').toLowerCase().includes(q) ||
      String(r.big ?? '').toLowerCase().includes(q)
    );
  }
  applySort(false);
}

function applySort(toggle) {
  if (sortKey) {
    const type = document.querySelector(`th[data-key="${sortKey}"]`).dataset.type;
    filtered = filtered.slice().sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (type === 'num') {
        av = av === null || av === undefined ? -Infinity : Number(av);
        bv = bv === null || bv === undefined ? -Infinity : Number(bv);
        return (av - bv) * sortDir;
      } else {
        av = (av ?? '').toString();
        bv = (bv ?? '').toString();
        return av.localeCompare(bv, 'it', { sensitivity: 'base' }) * sortDir;
      }
    });
  }
  render();
}

document.querySelectorAll('th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortDir *= -1;
    } else {
      sortKey = key;
      sortDir = 1;
    }
    document.querySelectorAll('th.sortable').forEach(h => {
      h.classList.remove('sorted');
      h.querySelector('.arrow').textContent = '';
    });
    th.classList.add('sorted');
    th.querySelector('.arrow').textContent = sortDir === 1 ? '\u25B2' : '\u25BC';
    applySort(true);
  });
});

searchInput.addEventListener('input', applyFilter);

render();
countEl.textContent = DATA.length.toLocaleString('it-IT') + ' risultati';
</script>
</body>
</html>
