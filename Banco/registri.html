let sortKey = null;
let sortDir = 1;
let filtered = DATA;

const tbody = document.getElementById('tbody');
const searchInput = document.getElementById('search');
const countEl = document.getElementById('count');
const totalCountEl = document.getElementById('totalCount');

totalCountEl.textContent = DATA.length.toLocaleString('it-IT');

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const rowsHtml = filtered.map(r => `
    <tr>
      <td class="num">${esc(r.scat)}</td>
      <td class="num">${esc(r.quant)}</td>
      <td class="divider">|</td>
      <td>${esc(r.forn)}</td>
      <td class="desc">${esc(r.desc)}</td>
      <td class="divider">|</td>
      <td class="num">${esc(r.big)}</td>
    </tr>`).join('');
  tbody.innerHTML = rowsHtml || '';
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-msg">Nessun risultato trovato.</td></tr>';
  }
  countEl.textContent = filtered.length.toLocaleString('it-IT') + ' risultati';
}

function applyFilter() {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    filtered = DATA;
  } else {
    filtered = DATA.filter(r =>
      String(r.scat ?? '').toLowerCase().includes(q) ||
      String(r.quant ?? '').toLowerCase().includes(q) ||
      String(r.forn ?? '').toLowerCase().includes(q) ||
      String(r.desc ?? '').toLowerCase().includes(q) ||
      String(r.big ?? '').toLowerCase().includes(q)
    );
  }
  applySort(false);
}

function applySort(toggle) {
  if (sortKey) {
    const type = document.querySelector(`th[data-key="${sortKey}"]`).dataset.type;
    filtered = filtered.slice().sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (type === 'num') {
        av = av === null || av === undefined ? -Infinity : Number(av);
        bv = bv === null || bv === undefined ? -Infinity : Number(bv);
        return (av - bv) * sortDir;
      } else {
        av = (av ?? '').toString();
        bv = (bv ?? '').toString();
        return av.localeCompare(bv, 'it', { sensitivity: 'base' }) * sortDir;
      }
    });
  }
  render();
}

document.querySelectorAll('th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortDir *= -1;
    } else {
      sortKey = key;
      sortDir = 1;
    }
    document.querySelectorAll('th.sortable').forEach(h => {
      h.classList.remove('sorted');
      h.querySelector('.arrow').textContent = '';
    });
    th.classList.add('sorted');
    th.querySelector('.arrow').textContent = sortDir === 1 ? '\u25B2' : '\u25BC';
    applySort(true);
  });
});
